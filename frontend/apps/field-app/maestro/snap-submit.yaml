appId: com.wdc.fieldapp
---
- launchApp
- assertVisible: "Digital Reporting"
- tapOn: "Skip"
- assertVisible: "Select your LGA"
- tapOn: "Chikun"
- assertVisible: "Select your Ward"
- tapOn: "Chikun Ward 1"
- assertVisible: "Welcome back"
- tapOn: "Phone Number"
- inputText: "+2348012345678"
- tapOn: "PIN"
- inputText: "123456"
- tapOn: "Sign In"
- assertVisible: "Dashboard"
- tapOn: "New Report"
- assertVisible: "New Report"
# Advance through wizard to photo field (step 7)
- repeat:
    times: 6
    commands:
      - tapOn: "Next"
- assertVisible: "Photo Evidence"
- tapOn: "Photo Evidence"
- assertVisible: "Photo Report"
- tapOn: "Capture"
- assertVisible: "Scanning document..."
- assertVisible: "Review Extracted Data"
- assertVisible: "Meeting Date"
- tapOn: "Use Extracted Data"
- assertVisible: "New Report"
- tapOn: "Submit Report"
- assertVisible: "Submitted"
