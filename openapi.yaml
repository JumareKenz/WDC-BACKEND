openapi: 3.1.0
info:
  title: WDC Backend
  version: 0.1.0
  description: |
    Kaduna State WDC Digital Reporting Platform — REST API.

    M1 milestone: only health endpoints are exposed. Subsequent milestones
    add auth, users, wards, forms, reports, sync, messaging, investigations,
    audit, ai, and notifications under `/api/v1/`.
servers:
  - url: http://localhost:3000
    description: Local development
paths:
  /api/v1/auth/sign-in/mobile:
    post:
      summary: Mobile sign-in (phone + PIN)
      operationId: authSignInMobile
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, pin, deviceId]
              properties:
                phone: { type: string, example: '+2348012345678' }
                pin: { type: string, pattern: '^\d{6}$' }
                deviceId: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '200': { description: token pair, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }
        '401': { description: invalid credentials }
        '422': { description: validation error }
  /api/v1/auth/sign-in/console:
    post:
      summary: Console sign-in (email + password + TOTP, director only)
      operationId: authSignInConsole
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, totp, deviceId]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 12, maxLength: 256 }
                totp: { type: string, pattern: '^\d{6}$' }
                deviceId: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200': { description: token pair, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }
        '401': { description: invalid credentials }
        '422': { description: validation error }
  /api/v1/auth/set-credentials:
    post:
      summary: Redeem an enrolment token to set PIN or password+TOTP
      operationId: authSetCredentials
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrolmentToken]
              properties:
                enrolmentToken: { type: string, minLength: 40, maxLength: 100 }
                pin: { type: string, pattern: '^\d{6}$', description: 'For mobile (secretary/coordinator)' }
                password: { type: string, minLength: 12, maxLength: 256, description: 'For console (director)' }
                totpSecret: { type: string, minLength: 16, maxLength: 64 }
                totp: { type: string, pattern: '^\d{6}$' }
      responses:
        '200':
          description: credentials set
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties: { ok: { type: boolean, enum: [true] } }
        '400': { description: missing required fields for the user's role }
        '401': { description: token unrecognised or expired }
  /api/v1/auth/refresh:
    post:
      summary: Rotate refresh token; returns a fresh access+refresh pair
      operationId: authRefresh
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken, deviceId]
              properties:
                refreshToken: { type: string, minLength: 32, maxLength: 256 }
                deviceId: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '200': { description: new token pair, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }
        '401': { description: token unrecognised, expired, mismatched device, or reused }
  /api/v1/auth/sign-out:
    post:
      summary: Revoke all refresh tokens for the calling device
      operationId: authSignOut
      tags: [auth]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '200':
          description: count of refresh tokens revoked
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: integer, minimum: 0 }
        '401': { description: missing or invalid bearer }
  /api/v1/users:
    get:
      summary: List users (RLS-scoped to caller; cursor-paginated)
      operationId: usersList
      tags: [users]
      security: [{ bearer: [] }]
      parameters:
        - in: query
          name: role
          schema: { type: string, enum: [secretary, coordinator, director] }
        - in: query
          name: lgaId
          schema: { type: string, format: uuid }
        - in: query
          name: wardId
          schema: { type: string, format: uuid }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: string, description: '1–100, default 25' }
      responses:
        '200':
          description: page of users
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  nextCursor: { type: string, nullable: true }
        '401': { description: missing or invalid bearer }
    post:
      summary: Create a user; returns a one-time enrolment token (director only)
      operationId: usersCreate
      tags: [users]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUser' }
      responses:
        '201':
          description: user created with enrolment token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateUserResponse' }
        '403': { description: requires director }
        '409': { description: phone already in use }
  /api/v1/users/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get one user (RLS-scoped)
      operationId: usersGet
      tags: [users]
      security: [{ bearer: [] }]
      responses:
        '200': { description: user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '404': { description: not found }
    delete:
      summary: Soft-delete a user (director only)
      operationId: usersDelete
      tags: [users]
      security: [{ bearer: [] }]
      responses:
        '204': { description: deleted }
        '403': { description: requires director }
        '404': { description: not found }
  /api/v1/users/{id}/assignment:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Reassign a user to a different LGA / ward (director only)
      operationId: usersUpdateAssignment
      tags: [users]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lgaId: { type: string, format: uuid, nullable: true }
                wardId: { type: string, format: uuid, nullable: true }
      responses:
        '200': { description: updated, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '403': { description: requires director }
  /api/v1/users/{id}/suspend:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Suspend a user (director only)
      operationId: usersSuspend
      tags: [users]
      security: [{ bearer: [] }]
      responses:
        '200': { description: suspended, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '403': { description: requires director }
  /api/v1/users/{id}/reactivate:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Reactivate a suspended user (director only)
      operationId: usersReactivate
      tags: [users]
      security: [{ bearer: [] }]
      responses:
        '200': { description: reactivated, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '403': { description: requires director }
  /api/v1/forms:
    get:
      summary: List forms (RLS-scoped)
      operationId: formsList
      tags: [forms]
      security: [{ bearer: [] }]
      responses:
        '200':
          description: forms array
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Form' } }
        '401': { description: missing or invalid bearer }
    post:
      summary: Create a draft form (director only)
      operationId: formsCreate
      tags: [forms]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateForm' } } }
      responses:
        '201': { description: form created, content: { application/json: { schema: { $ref: '#/components/schemas/Form' } } } }
        '403': { description: requires director }
        '409': { description: slug already in use }
  /api/v1/forms/visible:
    get:
      summary: Forms the caller can fill, computed from RLS context
      operationId: formsVisible
      tags: [forms]
      security: [{ bearer: [] }]
      responses:
        '200':
          description: deployed forms in caller scope
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Form' } }
  /api/v1/forms/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get one form
      operationId: formsGet
      tags: [forms]
      security: [{ bearer: [] }]
      responses:
        '200': { description: form, content: { application/json: { schema: { $ref: '#/components/schemas/Form' } } } }
        '404': { description: not found }
    patch:
      summary: Update form metadata or scope (director only)
      operationId: formsUpdate
      tags: [forms]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                titleHa: { type: string }
                scopeKind: { type: string, enum: [state, lga, ward] }
                scopeIds: { type: array, items: { type: string, format: uuid } }
      responses:
        '200': { description: updated, content: { application/json: { schema: { $ref: '#/components/schemas/Form' } } } }
        '403': { description: requires director }
  /api/v1/forms/{id}/deploy:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Deploy the latest version; freezes it (director only)
      operationId: formsDeploy
      tags: [forms]
      security: [{ bearer: [] }]
      responses:
        '200': { description: deployed, content: { application/json: { schema: { $ref: '#/components/schemas/Form' } } } }
        '400': { description: form has no versions to deploy }
        '403': { description: requires director }
        '409': { description: latest version already deployed }
  /api/v1/forms/{id}/archive:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Archive a form (director only)
      operationId: formsArchive
      tags: [forms]
      security: [{ bearer: [] }]
      responses:
        '200': { description: archived, content: { application/json: { schema: { $ref: '#/components/schemas/Form' } } } }
        '403': { description: requires director }
  /api/v1/forms/{id}/versions:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: List versions of a form
      operationId: formsListVersions
      tags: [forms]
      security: [{ bearer: [] }]
      responses:
        '200':
          description: versions
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/FormVersion' } }
    post:
      summary: Create a new draft version (director only)
      operationId: formsCreateVersion
      tags: [forms]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schema]
              properties:
                schema: { type: object, additionalProperties: true }
      responses:
        '201': { description: version created, content: { application/json: { schema: { $ref: '#/components/schemas/FormVersion' } } } }
        '400': { description: invalid form schema }
        '403': { description: requires director }
  /api/v1/forms/{id}/versions/{n}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: n
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      summary: Get a specific version of a form
      operationId: formsGetVersion
      tags: [forms]
      security: [{ bearer: [] }]
      responses:
        '200': { description: version, content: { application/json: { schema: { $ref: '#/components/schemas/FormVersion' } } } }
        '404': { description: not found }
  /api/v1/audit/anchor:
    post:
      summary: Create a new audit anchor (director / scheduler)
      operationId: auditCreateAnchor
      tags: [audit]
      security: [{ bearer: [] }]
      responses:
        '200':
          description: anchor created (or no-op when audit log is empty)
          content:
            application/json:
              schema:
                type: object
                required: [created]
                properties:
                  created: { type: boolean }
                  id: { type: string }
                  latestEventId: { type: string }
                  latestHash: { type: string }
        '403': { description: requires director / system }
  /api/v1/audit/anchors:
    get:
      summary: List recent audit anchors with verify-on-read status
      operationId: auditListAnchors
      tags: [audit]
      security: [{ bearer: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        '200':
          description: anchors (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, anchoredAt, latestEventId, latestHash, signatureAlg, signingKeyId, signature, verified]
                  properties:
                    id: { type: string }
                    anchoredAt: { type: string, format: date-time }
                    latestEventId: { type: string }
                    latestHash: { type: string }
                    signatureAlg: { type: string }
                    signingKeyId: { type: string }
                    signature: { type: string }
                    verified: { type: boolean }
        '403': { description: requires director / system }
  /api/v1/audit/export:
    get:
      summary: Sealed CSV export bounded by the most recent anchor
      operationId: auditExport
      tags: [audit]
      security: [{ bearer: [] }]
      responses:
        '200':
          description: CSV stream prefixed with anchor preamble (#-prefixed lines)
          content:
            text/csv:
              schema: { type: string }
        '403': { description: requires director / system }
  /health/live:
    get:
      summary: Liveness probe
      operationId: healthLive
      tags: [health]
      responses:
        '200':
          description: Process is up
          content:
            application/json:
              schema:
                type: object
                required: [status, uptime]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  uptime:
                    type: number
                    description: Process uptime in seconds
  /health/ready:
    get:
      summary: Readiness probe (checks Postgres + Redis)
      operationId: healthReady
      tags: [health]
      responses:
        '200':
          description: All dependencies responsive
        '503':
          description: One or more dependencies unhealthy
  /api/v1/reports:
    get:
      summary: List reports (RLS-scoped)
      operationId: reportsList
      tags: [reports]
      security: [{ bearer: [] }]
      parameters:
        - in: query
          name: state
          schema: { type: string, enum: [draft, submitted, in_review, approved, returned, sealed] }
      responses:
        '200':
          description: reports array
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Report' } }
    post:
      summary: Create a draft report
      operationId: reportsCreate
      tags: [reports]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReport' }
      responses:
        '201': { description: report created, content: { application/json: { schema: { $ref: '#/components/schemas/Report' } } } }
  /api/v1/reports/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get one report
      operationId: reportsGet
      tags: [reports]
      security: [{ bearer: [] }]
      responses:
        '200': { description: report, content: { application/json: { schema: { $ref: '#/components/schemas/Report' } } } }
  /api/v1/reports/{id}/submit:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Submit a draft report
      operationId: reportsSubmit
      tags: [reports]
      security: [{ bearer: [] }]
      responses:
        '200': { description: submitted, content: { application/json: { schema: { $ref: '#/components/schemas/Report' } } } }
  /api/v1/reports/{id}/open-review:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Open review on a submitted report
      operationId: reportsOpenReview
      tags: [reports]
      security: [{ bearer: [] }]
      responses:
        '200': { description: in_review, content: { application/json: { schema: { $ref: '#/components/schemas/Report' } } } }
  /api/v1/reports/{id}/approve:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Approve a report under review
      operationId: reportsApprove
      tags: [reports]
      security: [{ bearer: [] }]
      responses:
        '200': { description: approved, content: { application/json: { schema: { $ref: '#/components/schemas/Report' } } } }
  /api/v1/reports/{id}/return:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Return a report under review
      operationId: reportsReturn
      tags: [reports]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnReport' }
      responses:
        '200': { description: returned, content: { application/json: { schema: { $ref: '#/components/schemas/Report' } } } }
  /api/v1/reports/{id}/edit-returned:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Move a returned report back to draft
      operationId: reportsEditReturned
      tags: [reports]
      security: [{ bearer: [] }]
      responses:
        '200': { description: draft, content: { application/json: { schema: { $ref: '#/components/schemas/Report' } } } }
  /api/v1/telemetry:
    post:
      summary: Log a client telemetry event
      operationId: telemetryLog
      tags: [telemetry]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelemetryLog' }
      responses:
        '200': { description: logged, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
  /ai/ask:
    post:
      summary: Ask the AI assistant
      operationId: aiAsk
      tags: [ai]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AskAi' }
      responses:
        '200': { description: answer, content: { application/json: { schema: { $ref: '#/components/schemas/AiResponse' } } } }
  /messages/broadcast:
    post:
      summary: Broadcast a message (director only)
      operationId: messagesBroadcast
      tags: [messages]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BroadcastMessage' }
      responses:
        '201': { description: broadcast queued, content: { application/json: { schema: { $ref: '#/components/schemas/BroadcastResponse' } } } }
  /messages/deliveries:
    get:
      summary: List delivery attempts for the current user
      operationId: messagesListDeliveries
      tags: [messages]
      security: [{ bearer: [] }]
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: string }
      responses:
        '200':
          description: deliveries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListDeliveriesResponse' }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TokenResponse:
      type: object
      required: [accessToken, accessExpiresIn, refreshToken, refreshExpiresAt]
      properties:
        accessToken: { type: string, description: 'JWT (RS256), 15min default TTL' }
        accessExpiresIn: { type: integer, description: 'Seconds until access expires' }
        refreshToken: { type: string, description: 'Opaque token; rotated on use' }
        refreshExpiresAt: { type: string, format: date-time }
    User:
      type: object
      required: [id, role, fullName, phone, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [secretary, coordinator, director, system] }
        fullName: { type: string }
        phone: { type: string, example: '+2348012345678' }
        email: { type: string, format: email, nullable: true }
        lgaId: { type: string, format: uuid, nullable: true }
        wardId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [active, suspended, deleted] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateUser:
      type: object
      required: [role, fullName, phone]
      properties:
        role: { type: string, enum: [secretary, coordinator, director] }
        fullName: { type: string, minLength: 1, maxLength: 200 }
        phone: { type: string, example: '+2348012345678' }
        email: { type: string, format: email }
        lgaId: { type: string, format: uuid, description: 'Required for coordinator + secretary' }
        wardId: { type: string, format: uuid, description: 'Required for secretary' }
    CreateUserResponse:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [enrolmentToken, enrolmentExpiresAt]
          properties:
            enrolmentToken: { type: string, description: 'One-time, redeem within 24h via /auth/set-credentials' }
            enrolmentExpiresAt: { type: string, format: date-time }
    Form:
      type: object
      required: [id, slug, title, titleHa, scopeKind, scopeIds, status, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        titleHa: { type: string, description: 'Hausa label (first-class)' }
        scopeKind: { type: string, enum: [state, lga, ward] }
        scopeIds: { type: array, items: { type: string, format: uuid } }
        status: { type: string, enum: [draft, deployed, archived] }
        currentVersionId: { type: string, format: uuid, nullable: true }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateForm:
      type: object
      required: [slug, title, titleHa, scopeKind]
      properties:
        slug: { type: string, pattern: '^[a-z][a-z0-9-]*$' }
        title: { type: string, minLength: 1, maxLength: 200 }
        titleHa: { type: string, minLength: 1, maxLength: 200 }
        scopeKind: { type: string, enum: [state, lga, ward] }
        scopeIds: { type: array, items: { type: string, format: uuid } }
    FormVersion:
      type: object
      required: [id, formId, versionNumber, schema, createdAt]
      properties:
        id: { type: string, format: uuid }
        formId: { type: string, format: uuid }
        versionNumber: { type: integer, minimum: 1 }
        schema: { type: object, additionalProperties: true, description: 'Validated by Zod; both label_en and label_ha mandatory on every field' }
        deployedAt: { type: string, format: date-time, nullable: true }
        deployedBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
    Report:
      type: object
      required: [id, formVersionId, wardId, submittedBy, submissionMethod, state, canonical, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        formVersionId: { type: string, format: uuid }
        wardId: { type: string, format: uuid }
        submittedBy: { type: string, format: uuid }
        submissionMethod: { type: string, enum: [amira, wizard, snap] }
        state: { type: string, enum: [draft, submitted, in_review, approved, returned, sealed] }
        sealedAt: { type: string, format: date-time, nullable: true }
        canonical: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateReport:
      type: object
      required: [formVersionId, submissionMethod]
      properties:
        formVersionId: { type: string, format: uuid }
        submissionMethod: { type: string, enum: [amira, wizard, snap] }
        wardId: { type: string, format: uuid }
    ReturnReport:
      type: object
      required: [notes]
      properties:
        notes: { type: string, minLength: 1, maxLength: 2000 }
    TelemetryLog:
      type: object
      required: [level, message]
      properties:
        level: { type: string, enum: [error, warn, debug, info] }
        message: { type: string }
        metadata: { type: object, additionalProperties: true }
    AskAi:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 2000 }
    AiResponse:
      type: object
      required: [answer, sources]
      properties:
        answer: { type: string }
        sources:
          type: array
          items:
            type: object
            required: [type, snippet]
            properties:
              type: { type: string, enum: [structured, semantic] }
              queryId: { type: string }
              embeddingId: { type: string }
              snippet: { type: string }
        cached: { type: boolean }
    BroadcastMessage:
      type: object
      required: [body, channels, scopeKind]
      properties:
        body: { type: string, minLength: 1, maxLength: 4000 }
        channels:
          type: array
          items: { type: string, enum: [in_app, email, sms, whatsapp] }
          minItems: 1
        scopeKind: { type: string, enum: [state, lga, ward] }
        scopeIds:
          type: array
          items: { type: string, format: uuid }
        urgent: { type: boolean }
    BroadcastResponse:
      type: object
      required: [messageId, conversationId, recipientCount, deliveryCount, queuedDuringQuietHours]
      properties:
        messageId: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        recipientCount: { type: integer }
        deliveryCount: { type: integer }
        queuedDuringQuietHours: { type: boolean }
    ListDeliveriesResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, channel, status, payload, queuedAt]
            properties:
              id: { type: string, format: uuid }
              channel: { type: string }
              status: { type: string }
              providerRef: { type: string, nullable: true }
              payload: { type: object, additionalProperties: true }
              queuedAt: { type: string, format: date-time }
              sentAt: { type: string, format: date-time, nullable: true }
              deliveredAt: { type: string, format: date-time, nullable: true }
              readAt: { type: string, format: date-time, nullable: true }
              failedAt: { type: string, format: date-time, nullable: true }
              errorMessage: { type: string, nullable: true }
        nextCursor: { type: string, nullable: true }
