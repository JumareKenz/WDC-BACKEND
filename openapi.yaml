openapi: 3.1.0
info:
  title: WDC Backend
  version: 0.1.0
  description: |
    Kaduna State WDC Digital Reporting Platform — REST API.

    M1 milestone: only health endpoints are exposed. Subsequent milestones
    add auth, users, wards, forms, reports, sync, messaging, investigations,
    audit, ai, and notifications under `/api/v1/`.
servers:
  - url: http://localhost:3000
    description: Local development
paths:
  /api/v1/auth/sign-in/mobile:
    post:
      summary: Mobile sign-in (phone + PIN)
      operationId: authSignInMobile
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, pin, deviceId]
              properties:
                phone: { type: string, example: '+2348012345678' }
                pin: { type: string, pattern: '^\d{6}$' }
                deviceId: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '200': { description: token pair, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }
        '401': { description: invalid credentials }
        '422': { description: validation error }
  /api/v1/auth/sign-in/console:
    post:
      summary: Console sign-in (email + password + TOTP, director only)
      operationId: authSignInConsole
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, totp, deviceId]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 12, maxLength: 256 }
                totp: { type: string, pattern: '^\d{6}$' }
                deviceId: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200': { description: token pair, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }
        '401': { description: invalid credentials }
        '422': { description: validation error }
  /api/v1/auth/set-credentials:
    post:
      summary: Redeem an enrolment token to set PIN or password+TOTP
      operationId: authSetCredentials
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrolmentToken]
              properties:
                enrolmentToken: { type: string, minLength: 40, maxLength: 100 }
                pin: { type: string, pattern: '^\d{6}$', description: 'For mobile (secretary/coordinator)' }
                password: { type: string, minLength: 12, maxLength: 256, description: 'For console (director)' }
                totpSecret: { type: string, minLength: 16, maxLength: 64 }
                totp: { type: string, pattern: '^\d{6}$' }
      responses:
        '200':
          description: credentials set
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties: { ok: { type: boolean, enum: [true] } }
        '400': { description: missing required fields for the user's role }
        '401': { description: token unrecognised or expired }
  /api/v1/auth/refresh:
    post:
      summary: Rotate refresh token; returns a fresh access+refresh pair
      operationId: authRefresh
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken, deviceId]
              properties:
                refreshToken: { type: string, minLength: 32, maxLength: 256 }
                deviceId: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '200': { description: new token pair, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }
        '401': { description: token unrecognised, expired, mismatched device, or reused }
  /api/v1/auth/sign-out:
    post:
      summary: Revoke all refresh tokens for the calling device
      operationId: authSignOut
      tags: [auth]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '200':
          description: count of refresh tokens revoked
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: integer, minimum: 0 }
        '401': { description: missing or invalid bearer }
  /api/v1/users:
    get:
      summary: List users (RLS-scoped to caller; cursor-paginated)
      operationId: usersList
      tags: [users]
      security: [{ bearer: [] }]
      parameters:
        - in: query
          name: role
          schema: { type: string, enum: [secretary, coordinator, director] }
        - in: query
          name: lgaId
          schema: { type: string, format: uuid }
        - in: query
          name: wardId
          schema: { type: string, format: uuid }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: string, description: '1–100, default 25' }
      responses:
        '200':
          description: page of users
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  nextCursor: { type: string, nullable: true }
        '401': { description: missing or invalid bearer }
    post:
      summary: Create a user; returns a one-time enrolment token (director only)
      operationId: usersCreate
      tags: [users]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUser' }
      responses:
        '201':
          description: user created with enrolment token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateUserResponse' }
        '403': { description: requires director }
        '409': { description: phone already in use }
  /api/v1/users/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get one user (RLS-scoped)
      operationId: usersGet
      tags: [users]
      security: [{ bearer: [] }]
      responses:
        '200': { description: user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '404': { description: not found }
    delete:
      summary: Soft-delete a user (director only)
      operationId: usersDelete
      tags: [users]
      security: [{ bearer: [] }]
      responses:
        '204': { description: deleted }
        '403': { description: requires director }
        '404': { description: not found }
  /api/v1/users/{id}/assignment:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Reassign a user to a different LGA / ward (director only)
      operationId: usersUpdateAssignment
      tags: [users]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lgaId: { type: string, format: uuid, nullable: true }
                wardId: { type: string, format: uuid, nullable: true }
      responses:
        '200': { description: updated, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '403': { description: requires director }
  /api/v1/users/{id}/suspend:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Suspend a user (director only)
      operationId: usersSuspend
      tags: [users]
      security: [{ bearer: [] }]
      responses:
        '200': { description: suspended, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '403': { description: requires director }
  /api/v1/users/{id}/reactivate:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Reactivate a suspended user (director only)
      operationId: usersReactivate
      tags: [users]
      security: [{ bearer: [] }]
      responses:
        '200': { description: reactivated, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '403': { description: requires director }
  /api/v1/forms:
    get:
      summary: List forms (RLS-scoped)
      operationId: formsList
      tags: [forms]
      security: [{ bearer: [] }]
      responses:
        '200':
          description: forms array
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Form' } }
        '401': { description: missing or invalid bearer }
    post:
      summary: Create a draft form (director only)
      operationId: formsCreate
      tags: [forms]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateForm' } } }
      responses:
        '201': { description: form created, content: { application/json: { schema: { $ref: '#/components/schemas/Form' } } } }
        '403': { description: requires director }
        '409': { description: slug already in use }
  /api/v1/forms/visible:
    get:
      summary: Forms the caller can fill, computed from RLS context
      operationId: formsVisible
      tags: [forms]
      security: [{ bearer: [] }]
      responses:
        '200':
          description: deployed forms in caller scope
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Form' } }
  /api/v1/forms/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get one form
      operationId: formsGet
      tags: [forms]
      security: [{ bearer: [] }]
      responses:
        '200': { description: form, content: { application/json: { schema: { $ref: '#/components/schemas/Form' } } } }
        '404': { description: not found }
    patch:
      summary: Update form metadata or scope (director only)
      operationId: formsUpdate
      tags: [forms]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                titleHa: { type: string }
                scopeKind: { type: string, enum: [state, lga, ward] }
                scopeIds: { type: array, items: { type: string, format: uuid } }
      responses:
        '200': { description: updated, content: { application/json: { schema: { $ref: '#/components/schemas/Form' } } } }
        '403': { description: requires director }
  /api/v1/forms/{id}/deploy:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Deploy the latest version; freezes it (director only)
      operationId: formsDeploy
      tags: [forms]
      security: [{ bearer: [] }]
      responses:
        '200': { description: deployed, content: { application/json: { schema: { $ref: '#/components/schemas/Form' } } } }
        '400': { description: form has no versions to deploy }
        '403': { description: requires director }
        '409': { description: latest version already deployed }
  /api/v1/forms/{id}/archive:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Archive a form (director only)
      operationId: formsArchive
      tags: [forms]
      security: [{ bearer: [] }]
      responses:
        '200': { description: archived, content: { application/json: { schema: { $ref: '#/components/schemas/Form' } } } }
        '403': { description: requires director }
  /api/v1/forms/{id}/versions:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: List versions of a form
      operationId: formsListVersions
      tags: [forms]
      security: [{ bearer: [] }]
      responses:
        '200':
          description: versions
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/FormVersion' } }
    post:
      summary: Create a new draft version (director only)
      operationId: formsCreateVersion
      tags: [forms]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schema]
              properties:
                schema: { type: object, additionalProperties: true }
      responses:
        '201': { description: version created, content: { application/json: { schema: { $ref: '#/components/schemas/FormVersion' } } } }
        '400': { description: invalid form schema }
        '403': { description: requires director }
  /api/v1/forms/{id}/versions/{n}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: n
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      summary: Get a specific version of a form
      operationId: formsGetVersion
      tags: [forms]
      security: [{ bearer: [] }]
      responses:
        '200': { description: version, content: { application/json: { schema: { $ref: '#/components/schemas/FormVersion' } } } }
        '404': { description: not found }
  /health/live:
    get:
      summary: Liveness probe
      operationId: healthLive
      tags: [health]
      responses:
        '200':
          description: Process is up
          content:
            application/json:
              schema:
                type: object
                required: [status, uptime]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  uptime:
                    type: number
                    description: Process uptime in seconds
  /health/ready:
    get:
      summary: Readiness probe (checks Postgres + Redis)
      operationId: healthReady
      tags: [health]
      responses:
        '200':
          description: All dependencies responsive
        '503':
          description: One or more dependencies unhealthy
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TokenResponse:
      type: object
      required: [accessToken, accessExpiresIn, refreshToken, refreshExpiresAt]
      properties:
        accessToken: { type: string, description: 'JWT (RS256), 15min default TTL' }
        accessExpiresIn: { type: integer, description: 'Seconds until access expires' }
        refreshToken: { type: string, description: 'Opaque token; rotated on use' }
        refreshExpiresAt: { type: string, format: date-time }
    User:
      type: object
      required: [id, role, fullName, phone, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [secretary, coordinator, director, system] }
        fullName: { type: string }
        phone: { type: string, example: '+2348012345678' }
        email: { type: string, format: email, nullable: true }
        lgaId: { type: string, format: uuid, nullable: true }
        wardId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [active, suspended, deleted] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateUser:
      type: object
      required: [role, fullName, phone]
      properties:
        role: { type: string, enum: [secretary, coordinator, director] }
        fullName: { type: string, minLength: 1, maxLength: 200 }
        phone: { type: string, example: '+2348012345678' }
        email: { type: string, format: email }
        lgaId: { type: string, format: uuid, description: 'Required for coordinator + secretary' }
        wardId: { type: string, format: uuid, description: 'Required for secretary' }
    CreateUserResponse:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [enrolmentToken, enrolmentExpiresAt]
          properties:
            enrolmentToken: { type: string, description: 'One-time, redeem within 24h via /auth/set-credentials' }
            enrolmentExpiresAt: { type: string, format: date-time }
    Form:
      type: object
      required: [id, slug, title, titleHa, scopeKind, scopeIds, status, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        titleHa: { type: string, description: 'Hausa label (first-class)' }
        scopeKind: { type: string, enum: [state, lga, ward] }
        scopeIds: { type: array, items: { type: string, format: uuid } }
        status: { type: string, enum: [draft, deployed, archived] }
        currentVersionId: { type: string, format: uuid, nullable: true }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateForm:
      type: object
      required: [slug, title, titleHa, scopeKind]
      properties:
        slug: { type: string, pattern: '^[a-z][a-z0-9-]*$' }
        title: { type: string, minLength: 1, maxLength: 200 }
        titleHa: { type: string, minLength: 1, maxLength: 200 }
        scopeKind: { type: string, enum: [state, lga, ward] }
        scopeIds: { type: array, items: { type: string, format: uuid } }
    FormVersion:
      type: object
      required: [id, formId, versionNumber, schema, createdAt]
      properties:
        id: { type: string, format: uuid }
        formId: { type: string, format: uuid }
        versionNumber: { type: integer, minimum: 1 }
        schema: { type: object, additionalProperties: true, description: 'Validated by Zod; both label_en and label_ha mandatory on every field' }
        deployedAt: { type: string, format: date-time, nullable: true }
        deployedBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
